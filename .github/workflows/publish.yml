name: Publish npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'LeonhardtHUST/dsh-decision-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read manifest before this push
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]
          git show "${BEFORE_SHA}:package.json" > "$RUNNER_TEMP/previous-package.json"
      - name: Detect package version increase
        id: version
        run: node scripts/detect-release.mjs "$RUNNER_TEMP/previous-package.json"

  verify:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [detect, verify]
    if: needs.detect.outputs.changed == 'true' && github.repository == 'LeonhardtHUST/dsh-decision-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VP_GIT_HOOKS: '0'
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.detect.outputs.previous_version }}
      NPM_DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          version: '1.6.0'
          node-version: '24'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run verify:release
      - run: vp run pack:release
      - run: vp run verify:package
      - name: Publish verified tarball using OIDC
        run: npm publish ./release-artifacts/*.tgz --registry "https://registry.npmjs.org/" --access public --provenance --tag "$NPM_DIST_TAG"
