name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          version: '1.6.0'
          node-version: '24'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run verify
      - run: vp run verify:guard
      - run: vp run pack:release
      - run: vp run verify:package
